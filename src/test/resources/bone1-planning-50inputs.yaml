    expose:
      ha: { enabled: true, events: [click, double] }

  - id: stairs_motion1
    name: Klatka czujka ruchu 1
    type: input
    input: input_board.input3
    location: building.floor1.stairs
    sensor_type: motion
    inverted: true
    expose:
      ha: { enabled: true }

  - id: stairs_door1
    name: Drzwi klatka
    type: input
    input: input_board.input4
    location: building.floor1.stairs
    sensor_type: door
    inverted: true
    expose:
      ha: { enabled: true }

  - id: stairs_light1
    name: Klatka oświetlenie
    type: light
    output: output_board.output1
    location: building.floor1.stairs
    restore_state: true
    expose:
      ha: { enabled: true }

  - id: stairs_switch1
    name: Klatka włącznik
    type: switch
    input: input_board.input5
    location: building.floor1.stairs
    clicks: { click: true, double: false, long: false, release: false }
    actions:

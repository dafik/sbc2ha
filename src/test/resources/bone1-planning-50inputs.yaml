# ---------------------------------------------------------------------------
# bone1 — planning config (50 inputs scale check)
# ---------------------------------------------------------------------------
# DRAFT — not production-ready. Used to validate that the config model
# remains readable and parseable at ~50 switch/sensor inputs spread across
# multiple locations.
#
# Location IDs use dotted notation (e.g. floor1.stairs).
# Dotted keys are plain strings — NOT YAML nesting.
# Location hierarchy is expressed via `parent` references where needed.
#
# Pain points identified during drafting:
# 1. Repetitive device entries make the file long; no config templates
#    or loop-back mechanism exists today.
# 2. Per-device `expose.ha.events` duplication across many switches.
# 3. Actions.click wiring is verbose for simple toggle patterns.
# ---------------------------------------------------------------------------

sbc2ha:
  id: bone1
  name: bone1 — 50 inputs planning
  schema: "1"

runtime:
  offline_first: true

hardware:
  board: { id: main, type: beaglebone-black }
  buses:
    i2c2: { type: i2c, path: /dev/i2c-2 }
  profiles:
    input_board:
      type: boneio.input-v0.4
      board: main
    output_board:
      type: boneio.output-24x16a-v0.4
      bus: i2c2
      addresses: { mcp1: 0x20, mcp2: 0x21 }

# ---------------------------------------------------------------------------
# Locations — building / floor / zone hierarchy
# Dotted IDs are plain strings (e.g. "floor1.stairs"), not nested YAML.
# ---------------------------------------------------------------------------
locations:
  building: { name: Budynek A }
  building.floor1: { name: Piętro 1, parent: building }
  building.floor1.stairs: { name: Klatka, parent: building.floor1 }
  building.floor1.hallway: { name: Korytarz, parent: building.floor1 }
  building.floor1.office1: { name: Biuro 1, parent: building.floor1 }
  building.floor1.office2: { name: Biuro 2, parent: building.floor1 }
  building.floor1.bathroom: { name: Łazienka, parent: building.floor1 }
  building.floor1.storage: { name: Piwnica, parent: building.floor1 }
  building.floor2: { name: Piętro 2, parent: building }
  building.floor2.stairs: { name: Klatka 2, parent: building.floor2 }
  building.floor2.hallway: { name: Korytarz 2, parent: building.floor2 }
  building.floor2.lobby: { name: Foyer, parent: building.floor2 }

devices:
  # === STAIRS (floor1) — 6 switches ===
  - id: stairs_btn1
    name: Klatka przycisk 1
    type: switch
    input: input_board.input1
    location: building.floor1.stairs
    clicks: { click: true, double: true, long: false, release: false }
    actions:
      click:
        - { type: output.toggle, target: stairs_light1 }
    expose:
      ha: { enabled: true, events: [click, double] }

  - id: stairs_btn2
    name: Klatka przycisk 2
    type: switch
    input: input_board.input2
    location: building.floor1.stairs
    clicks: { click: true, double: true, long: false, release: false }

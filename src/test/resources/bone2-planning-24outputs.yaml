# ---------------------------------------------------------------------------
# bone2 — planning config (24 outputs scale check)
# ---------------------------------------------------------------------------
# DRAFT — not production-ready. Used to validate that the config model
# remains readable and parseable at ~24 light/relay outputs on a single
# bone2 node.
#
# bone2 targets the output-24x16A-v0.4 board (2× MCP23017: 0x20, 0x21).
# This config exercises all 24 output pins with restore_state enabled.
#
# Pain points identified during drafting:
# 1. 24 output entries are very verbose — repetitive `restore_state` and
#    `expose.ha` fields on every device.
# 2. No config template or "default" mechanism exists today.
# 3. Location grouping by floor is implicit (no programmatic floor query).
# ---------------------------------------------------------------------------

sbc2ha:
  id: bone2
  name: bone2 — 24 outputs planning
  schema: "1"

runtime:
  offline_first: true

hardware:
  board: { id: main, type: beaglebone-black }
  buses:
    i2c2: { type: i2c, path: /dev/i2c-2 }
  profiles:
    output_board:
      type: boneio.output-24x16a-v0.4
      bus: i2c2
      addresses: { mcp1: 0x20, mcp2: 0x21 }

# ---------------------------------------------------------------------------
# Locations — separate building from bone1
# ---------------------------------------------------------------------------
locations:
  building2: { name: Budynek B }
  building2.floor1: { name: Piętro 1, parent: building2 }
  building2.floor1.zone_a: { name: Strefa A, parent: building2.floor1 }
  building2.floor1.zone_b: { name: Strefa B, parent: building2.floor1 }
  building2.floor1.zone_c: { name: Strefa C, parent: building2.floor1 }
  building2.floor1.zone_d: { name: Strefa D, parent: building2.floor1 }
  building2.floor2: { name: Piętro 2, parent: building2 }
  building2.floor2.zone_e: { name: Strefa E, parent: building2.floor2 }
  building2.floor2.zone_f: { name: Strefa F, parent: building2.floor2 }

devices:
  # === ZONE A (floor1) — 6 outputs ===
  - id: zone_a_light1
    name: Strefa A oświetlenie 1
    type: light
    output: output_board.output1
    location: building2.floor1.zone_a
    restore_state: true
    expose:
      ha: { enabled: true }

  - id: zone_a_light2
    name: Strefa A oświetlenie 2
    type: light
    output: output_board.output2
    location: building2.floor1.zone_a
    restore_state: true

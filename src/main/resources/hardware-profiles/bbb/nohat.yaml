# BeagleBone Black (bare) board profile — no expansion HAT.
#
# This profile lists all 63 GPIO-capable pins across P8 (44) and P9 (19)
# headers plus 7 ADC pins as physical GPIO channels.
#
# Use this profile when the BBB runs with no BoneIO or similar expansion
# board attached — every pin is directly available for manual mapping.
#
# WARNING: Many pins share functions with alternate interfaces. When those
# interfaces are enabled (via device-tree overlays or uEnv.txt), the GPIO
# function may be disabled on the affected pins:
#
#   I2C1: P8_17, P8_18
#   I2C2: P8_19, P8_20
#   UART2: P8_21, P8_22, P9_11, P9_13
#   SPI0: P8_3, P8_5, P8_7, P8_9
#   PWM:  P8_13, P8_19, P9_14, P9_16
#
# Boot-critical pins (internal pull-up):
#   P8_37, P8_38, P8_45, P8_46, P9_21, P9_22
# Safe pins (no boot risk): P8_03-10, P8_13-15, P8_23-26,
# P9_12-16, P9_23, P9_25, P9_27-31, P9_42.


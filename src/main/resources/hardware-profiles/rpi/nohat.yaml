# Raspberry Pi with no HAT profile.
# Extracted from .plan/oldApp/helper/src/main/resources/extensionBoardDef/rpi/nohat.txt
# 23 unique GPIO outputs available on Raspberry Pi header when no HAT is attached.
# (GPIO_23, GPIO_24, GPIO_26 each appear at 2 different physical pins in source.)
#
# WARNING: Several pins share functions with alternate interfaces. When those
# interfaces are enabled (via device-tree overlays or config.txt), the GPIO
# function is disabled on the affected pins:
#   I2C1: GPIO_2 (pin 3),   GPIO_3 (pin 5)
#   UART0: GPIO_14 (pin 8), GPIO_15 (pin 10)
#   GPCLK0: GPIO_4 (pin 7)
#   SPI0: GPIO_10 (pin 19), GPIO_9 (pin 21), GPIO_11 (pin 23), GPIO_8 (pin 24), GPIO_7 (pin 26)
#   PCM/SPDIF: GPIO_18 (pin 12), GPIO_19 (pin 35), GPIO_20 (pin 38), GPIO_21 (pin 40)
#   PWM0: GPIO_12 (pin 32), PWM1: GPIO_13 (pin 33)
#
# Only use these pins as GPIO when the corresponding alternate function is NOT
# active in the current system configuration.


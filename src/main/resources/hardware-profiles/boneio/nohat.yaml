# BeagleBone Black (bare) no HAT profile.
# Based on official pinout from docs.beagleboard.org/boards/beaglebone/black/ch07.html.
# 63 GPIO-capable pins across P8 (44) and P9 (19) headers + 7 ADC inputs.
#
# NOTE: This is a bare BBB profile — not for use with BoneIO expansion boards.
# See boneio/input-v0.3.yaml or boneio/input-v0.2.yaml for BoneIO-specific boards.
#
# WARNING: Many pins share functions with alternate interfaces. When those
# interfaces are enabled (via device-tree overlays or uEnv.txt), the GPIO
# function may be disabled on the affected pins:
#
#   I2C1: P8_17 (GPIO0_5, SCL), P8_18 (GPIO0_4, SDA)
#   I2C2: P8_19 (GPIO0_13, SCL), P8_20 (GPIO0_12, SDA)
#   UART2: P8_21 (GPIO0_3, TXD), P8_22 (GPIO0_2, RXD)
#   UART4: P8_11 (GPIO1_13), P9_11 (GPIO0_30, RXD), P9_13 (GPIO0_31, TXD)
#   UART5: P8_31 (GPIO0_10, CTS), P8_32 (GPIO0_11, RTS),
#          P8_37 (GPIO2_14, TXD), P8_38 (GPIO2_15, RXD)
#   SPI0:  P8_3 (SPI_CS0), P8_5 (SPI_D0), P8_7 (SPI_D1), P8_9 (SPI_SCLK)
#   SPI1:  P9_17 (SPI_CS0), P9_21 (SPI_D0), P9_22 (SPI_D1), P9_23 (SPI_SCLK)
#   eCAP0/PWM0: P9_42 (GPIO0_7, eCAP0_in_PWM0_out)
#   eCAP2: P9_28 (GPIO3_17, eCAP2_in_PWM2_out)
#   eQEP0: P9_25 (GPIO3_21), P9_27 (GPIO3_19)
#   eQEP1: P8_31 (GPIO0_10), P8_32 (GPIO0_11)
#   eQEP2: P8_11 (GPIO1_13), P8_12 (GPIO1_12)
#   PWM: P8_13 (EHRPWM2B, GPIO0_23), P8_19 (EHRPWM2A, GPIO0_22),
#        P9_14 (EHRPWM1A, GPIO1_18), P9_16 (EHRPWM1B, GPIO1_19)
#   TIMER4-7: P8_7-10 (GPIO2_2-5)
#
# P9_41: Shared pin — CLKOUT2 (gpio0[20]) or GPIO3_20 (gpio3[20]).
#         Connected to P11_41. GPIO3_20 accessible via R221 removal or by
#         configuring SYS_RESETn (P9_11) as input.
# P9_42: Shared pin — GPIO3_18 (gpio3[18]) or GPIO0_7 (gpio0[7]).
#         Connected to P11_42. GPIO3_18 accessible via R202 removal.

# WARNING: Boot-critical pins. These pins have internal pull-up enabled at boot.
# If a connected device (e.g., contactor) pulls them low during boot, the BBB
# may fail to start. Connect devices to these pins only after boot completes,
# or ensure your device does not pull them low at power-on:
#
#   BOOT PRIORITY 1-2 (highest risk):
#     P8_37 (UART5_TXD, GPIO2_14) — pulled up, low = won't boot
#     P8_38 (UART5_RXD, GPIO2_15) — pulled up, low = won't boot
#
#   BOOT PRIORITY 9-10 (high risk):
#     P8_45 (LCD_DATA0, GPIO2_6)  — pulled up, low = won't boot
#     P8_46 (LCD_DATA1, GPIO2_7)  — pulled up, low = won't boot
#
#   BOOT PRIORITY 19-20 (medium risk):
#     P9_21 (UART2_TXD, GPIO0_3)  — pulled up, low = may not boot
#     P9_22 (UART2_RXD, GPIO0_2)  — pulled up, low = may not boot
#
#   BOOT PRIORITY 29-34 (lower risk, still caution):
#     P8_31 (UART5_CTSN, GPIO0_10) — pulled up
#     P8_32 (UART5_RTSN, GPIO0_11) — pulled up
#     P8_33 (UART4_RTSN, GPIO0_9)  — pulled up
#     P8_34 (UART3_RTSN, GPIO2_17) — pulled up
#     P8_35 (UART4_CTSN, GPIO0_8)  — pulled up
#     P8_36 (UART3_CTSN, GPIO2_16) — pulled up
#
# Safe pins (no internal pull-up, no boot risk): P8_03-10, P8_13-15, P8_23-26,
# P9_12-16, P9_23, P9_25, P9_27-31, P9_42. All others default to pull-down.

